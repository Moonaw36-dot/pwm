[package]
name = "aegis-core"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-Attribution"
description = "Platform-independent vault format, crypto and data model for Aegis"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5"
sha2 = "0.11.0"
rand = "0.10.0"
zeroize = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
totp-rs = { version = "2.0.1", features = ["otpauth"] }
base32 = "0.4.0"
