name: iOS

on:
  push:
    branches:
      - '**'
    paths:
      - 'ios/**'
      - 'aegis-core/**'
      - 'aegis-ffi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'aegis-core/**'
      - 'aegis-ffi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core and FFI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test -p aegis-core -p aegis-ffi --locked

  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Build IPA
        run: bash ios/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-unsigned-ipa
          path: ios/build/Aegis-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
