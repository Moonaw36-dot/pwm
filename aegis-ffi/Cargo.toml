[package]
name = "aegis-ffi"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-Attribution"
description = "UniFFI bindings exposing aegis-core to Swift (iOS app)"

[lib]
name = "aegis_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
aegis-core = { path = "../aegis-core" }
uniffi = "0.32.2"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
