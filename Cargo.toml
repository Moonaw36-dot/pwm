[package]
name = "aegis"
version = "1.7.2"
edition = "2024"
license = "LicenseRef-MIT-Attribution"

[dependencies]
sha2 = "0.11.0"
csv = "1.4.0"
ureq = "3"
sha1 = "0.11.0"
totp-rs = { version = "2.0.1", features = ["otpauth"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
imgui = { version = "0.12", features = ["freetype"] }
imgui-winit-support = "0.12"
imgui-glow-renderer = "0.12"
glow = "0.13"
winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
raw-window-handle = "0.5"
rfd = "0.17.2"
rand = "0.10.0"
zeroize = { version = "1", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
base32 = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
zxcvbn = "3.1.1"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

# Debug builds run unoptimized code everywhere, which makes Argon2 (unlock) and
# zxcvbn (strength meter) 10-15x slower. Optimize dependencies only; Aegis's own
# code stays easy to debug.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"

[workspace]
members = [".", "aegis-core", "aegis-ffi"]
